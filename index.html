<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAILCODE Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
    <div class="min-h-screen">
        <!-- Main Project Section -->
        <main class="max-w-7xl mx-auto px-4 py-8">
            <div class="header">
                <div>
                    <h1 class="header-title">HAILCODE <span class="header-sub">Tracker</span></h1>
                    <p>Track your coding progress and ideas</p>
                    <img src="assets/illustrations/flair4.png" alt="" class="header-emblem">
                </div>
                <div style="display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;">
                    <button id="addProjectBtn" class="btn btn-primary">
                        + New Project
                    </button>
                    <button id="settingsBtn" class="btn btn-sm">⚙️ Settings</button>
                    <label class="toggle-label">
                        <input type="checkbox" id="darkModeToggle" checked>
                        <span>Dark Mode</span>
                    </label>
                </div>
            </div>

            <div class="card">
                <div class="filter-bar">
                    <select id="sortField" class="sort-control">
                        <option value="date">Date Created</option>
                        <option value="progress">Completion %</option>
                        <option value="priority">Priority</option>
                        <option value="name">Alphabetical</option>
                        <option value="status">Status</option>
                    </select>
                    <button id="sortDirection" class="sort-toggle" aria-label="Toggle sort direction">↑</button>
                </div>

                <div id="projectsList" class="projects-grid"></div>
            </div>
        </main>

        <!-- Project Modal -->
        <div id="projectModal" class="hidden modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Add / Edit Project</h2>
                    <button type="button" id="closeModalBtn" class="modal-close" aria-label="Close">&times;</button>
                </div>
                <form id="projectForm">
                    <div class="space-y-4">
                        <input type="hidden" id="projectId">
                        <div class="form-group">
                            <label for="projectName">Project Name</label>
                            <input type="text" id="projectName" required class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="projectProgress">Completion Status (%)</label>
                            <input type="number" id="projectProgress" min="0" max="100" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="projectDescription">Description</label>
                            <textarea id="projectDescription" rows="3" class="form-control"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="projectPriority">Priority</label>
                            <select id="projectPriority" class="form-control">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="projectTags">Tags (comma separated)</label>
                            <input type="text" id="projectTags" class="form-control">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="cancelBtn" class="btn btn-sm">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Project</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="hidden modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>API Settings</h2>
                    <button type="button" id="closeSettingsBtn" class="modal-close" aria-label="Close">&times;</button>
                </div>
                <form id="settingsForm">
                    <div class="space-y-4">
                        <div class="form-group">
                            <label for="apiKey">OpenRouter API Key</label>
                            <input type="password" id="apiKey" class="form-control" placeholder="Enter your OpenRouter API key">
                            <p style="font-size: 0.85rem; margin-top: 0.5rem; opacity: 0.7;">Required for AI Insights. Get one at <a href="https://openrouter.ai" target="_blank" style="color: #c8a84b;">openrouter.ai</a></p>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="cancelSettingsBtn" class="btn btn-sm">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Key</button>
                    </div>
                </form>
            </div>
        </div>

        <footer class="footer">
            <div class="max-w-7xl mx-auto py-4 px-4 text-center">
                <p>&copy; 2026 HAILCODE Tracker. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
