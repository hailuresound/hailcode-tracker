<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hailure Brand Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-title">Hailure Brand Hub</div>
        <nav class="header-nav" id="headerNav">
            <button class="active" data-view="dashboard">Dashboard</button>
        </nav>
        <div class="header-actions">
            <button id="exportBtn" title="Export JSON backup">Export</button>
            <button id="importBtn" title="Import JSON backup">Import</button>
            <button id="themeBtn" class="theme-btn" title="Toggle theme">🌙</button>
        </div>
    </header>

    <!-- Main -->
    <main class="main" id="mainContent">
        <!-- Rendered by JS -->
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <!-- Rendered by JS -->
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Hidden file input for import -->
    <input type="file" id="importFileInput" accept=".json" style="display:none">

    <script src="idb.js"></script>
    <script src="app.js"></script>
</body>
</html>
