<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Project Manager</h1>
            <p class="text-gray-600">Your centralized hub for project organization and scaling</p>
        </header>

        <section class="mb-8">
            <div class="flex items-center justify-between mb-4">
                <div class="flex space-x-4">
                    <button id="sortDateAsc" class="px-4 py-2 rounded bg-gray-200 hover:bg-gray-300">Sort by Date ↑</button>
                    <button id="sortDateDesc" class="px-4 py-2 rounded bg-gray-200 hover:bg-gray-300">Sort by Date ↓</button>
                </div>
                <div class="flex items-center space-x-4">
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" id="darkModeToggle" class="rounded">
                        <span>Dark Mode</span>
                    </label>
                </div>
            </div>
        </section>

        <section id="projects">
            <div class="mb-6">
                <button id="addProjectBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Add New Project
                </button>
            </div>

            <div id="projectsList" class="grid gap-4"></div>
        </section>
    </div>

    <div id="projectModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg w-full max-w-2xl p-6">
            <h2 class="text-xl font-bold mb-4">Add/Edit Project</h2>
            <form id="projectForm">
                <div class="space-y-4">
                    <input type="hidden" id="projectId">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Project Name</label>
                        <input type="text" id="projectName" required
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Completion Status (%)</label>
                        <input type="number" id="projectProgress" min="0" max="100"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Description</label>
                        <textarea id="projectDescription" rows="3"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Scaling Tips</label>
                        <textarea id="projectScaling" rows="3"
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
                    </div>
                </div>
                <div class="mt-6 flex justify-end space-x-4">
                    <button type="button" id="cancelBtn" class="bg-gray-100 px-4 py-2 rounded hover:bg-gray-200">Cancel</button>
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Save Project</button>
                </div>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
